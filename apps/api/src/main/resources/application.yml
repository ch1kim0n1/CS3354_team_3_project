spring:
  application:
    name: study-buddy-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/study_buddy}
    username: ${DB_USERNAME:study_buddy}
    password: ${DB_PASSWORD:study_buddy}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
        secure: ${SESSION_COOKIE_SECURE:false}
management:
  endpoints:
    web:
      exposure:
        include: health,info
springdoc:
  swagger-ui:
    path: /api/docs
app:
  allowed-email-domain: ${ALLOWED_EMAIL_DOMAIN:utdallas.edu}
